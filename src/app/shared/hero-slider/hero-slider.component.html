<div class="hero-slider"
     (mouseenter)="pauseAutoSlide()"
     (mouseleave)="resumeAutoSlide()">

  <!-- Slides -->
  <div class="slide" *ngFor="let image of sliderImages; let i = index"
       [class.active]="i === currentIndex">
    <img [src]="image.url" [alt]="image.alt" loading="lazy">
    
    <!-- Elegant overlay -->
    <div class="overlay">
      <div class="container">
        <div class="hero-content">
          <h1>Welcome to <span>{{ clientData.name }}</span></h1>
          <p class="tagline">{{ clientData.tagline }}</p>
          <p class="subtitle">Premium Hair • Luxury Nails • Timeless Beauty</p>
          
          <div class="hero-ctas">
            <a routerLink="/booking" class="btn-primary">Book Your Appointment Now</a>
            <a routerLink="/menu" class="btn-secondary">View Our Full Menu</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Arrows -->
  <button class="arrow arrow-left" (click)="prevSlide()" aria-label="Previous slide">‹</button>
  <button class="arrow arrow-right" (click)="nextSlide()" aria-label="Next slide">›</button>

  <!-- Dots -->
  <div class="dots">
    <button *ngFor="let image of sliderImages; let i = index"
            [class.active]="i === currentIndex"
            (click)="goToSlide(i)"
            aria-label="Go to slide {{ i + 1 }}"></button>
  </div>
</div>
