<section class="services section section--alt" aria-label="Services">
  <div class="container">

    <div class="section-header">
      <span class="section-label">Services That Light Up the Night</span>
      <h2 class="section-heading">Choose your energy</h2>
    </div>

    <div class="services__grid">
      <article *ngFor="let service of business.services" class="service-card">
        <div class="service-card__icon" aria-hidden="true">
          <i [class]="service.icon"></i>
        </div>
        <h3 class="service-card__title">{{ service.title }}</h3>
        <p class="service-card__description">{{ service.description }}</p>
      </article>
    </div>

  </div>
</section>
