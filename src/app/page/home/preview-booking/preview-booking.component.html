<section class="cta-banner" aria-label="Call to action">
  <div class="cta-banner__glow" aria-hidden="true"></div>
  <div class="cta-banner__inner container">

    <div class="cta-banner__text">
      <h2 class="cta-banner__heading">Ready to make your event unforgettable?</h2>
      <p class="cta-banner__sub">Limited dates available — don't miss out.</p>
    </div>

    <a [routerLink]="business.ctaRoute" class="btn-primary cta-banner__btn">
      <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
      Book Wayne Heart
    </a>

  </div>
</section>
