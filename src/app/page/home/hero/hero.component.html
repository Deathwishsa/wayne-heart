<section class="hero" aria-label="Hero">

  <div class="hero__bg" aria-hidden="true"></div>
  <div class="hero__overlay" aria-hidden="true"></div>
  <div class="hero__pulse" aria-hidden="true"></div>

  <div class="hero__content container">

    <span class="hero__badge">
      <i class="fa-solid fa-star" aria-hidden="true"></i>
      Cape Town's #1 Event Entertainer
    </span>

    <h1 class="hero__name gold-gradient-text">{{ business.stageName }}</h1>
    <p class="hero__tagline">{{ business.heroTagline }}</p>

    <div class="hero__actions">
      <a [routerLink]="business.ctaRoute" class="btn-primary">
        Secure Your Date
        <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
      </a>
      <a routerLink="/gallery" class="btn-outline">
        See the Energy
      </a>
    </div>

    <div class="hero__categories" aria-label="Event types">
      <span *ngFor="let service of business.services" class="hero__category">
        <i class="fa-solid fa-check" aria-hidden="true"></i>
        {{ service.title }}
      </span>
    </div>

  </div>

</section>
