<div class="menu-page section-padding">
  <div class="container">
    <div class="page-header">
      <h1>Our Menu</h1>
      <p class="subtitle">Premium hair, nails &amp; signature combinations</p>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button 
        [class.active]="activeTab === 'hair'"
        (click)="setTab('hair')">
        Hair Specials
      </button>
      <button 
        [class.active]="activeTab === 'nails'"
        (click)="setTab('nails')">
        Nail Specials
      </button>
      <button 
        [class.active]="activeTab === 'combos'"
        (click)="setTab('combos')">
        Combo Deals
      </button>
    </div>

    <!-- Services Grid -->
    <div class="services-grid">
      <app-service-card 
        *ngFor="let service of currentServices"
        [service]="service">
      </app-service-card>
    </div>
  </div>
</div>
