<!-- ==========================================================================
     HEADER COMPONENT
     src/app/common/component/header/header.component.html
     ========================================================================== -->

<nav class="site-nav" [class.scrolled]="isScrolled">
  <div class="nav-inner">

    <!-- ── Logo / Brand ── -->
    <a routerLink="/" class="nav-brand" aria-label="Wayne Heart Home">
      <i class="fa-solid fa-microphone-lines nav-brand__icon" aria-hidden="true"></i>
      <div class="nav-brand__text">
        <span class="nav-brand__name">{{ business.stageName }}</span>
        <span class="nav-brand__tagline">{{ business.tagline }}</span>
      </div>
    </a>

    <!-- ── Desktop Navigation ── -->
    <ul class="nav-links" role="list">
      <li *ngFor="let item of business.nav">
        <a
          [routerLink]="item.route"
          class="nav-link"
          [class.nav-link--active]="isActive(item.route)"
          [attr.aria-current]="isActive(item.route) ? 'page' : null"
        >
          <i [class]="item.icon" aria-hidden="true"></i>
          {{ item.label }}
        </a>
      </li>
    </ul>

    <!-- ── Desktop CTA ── -->
    <a [routerLink]="business.ctaRoute" class="btn-primary nav-cta" aria-label="Book Wayne Heart">
      <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
      {{ business.ctaLabel }}
    </a>

    <!-- ── Mobile Hamburger ── -->
    <button
      class="hamburger"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="mobileMenuOpen"
      aria-label="Toggle navigation menu"
    >
      <i
        class="fa-solid"
        [class.fa-bars]="!mobileMenuOpen"
        [class.fa-xmark]="mobileMenuOpen"
        aria-hidden="true"
      ></i>
    </button>

  </div>

  <!-- ── Mobile Menu ── -->
  <div class="mobile-menu" [class.mobile-menu--open]="mobileMenuOpen" role="navigation" aria-label="Mobile navigation">
    <ul class="mobile-menu__links" role="list">
      <li *ngFor="let item of business.nav">
        <a
          [routerLink]="item.route"
          class="mobile-menu__link"
          [class.mobile-menu__link--active]="isActive(item.route)"
          (click)="toggleMobileMenu()"
        >
          <i [class]="item.icon" aria-hidden="true"></i>
          {{ item.label }}
        </a>
      </li>
    </ul>

    <a
      [routerLink]="business.ctaRoute"
      class="btn-primary mobile-menu__cta"
      (click)="toggleMobileMenu()"
    >
      <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
      {{ business.ctaLabel }}
    </a>
  </div>
</nav>
