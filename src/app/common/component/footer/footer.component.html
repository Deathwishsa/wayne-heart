<!-- ==========================================================================
     FOOTER COMPONENT
     src/app/common/component/footer/footer.component.html
     ========================================================================== -->

<footer class="site-footer">
  <div class="footer-inner">

    <!-- ── Brand Column ── -->
    <div class="footer-brand">
      <div class="footer-brand__logo">
        <i class="fa-solid fa-microphone-lines" aria-hidden="true"></i>
        <span class="footer-brand__name">{{ business.stageName }}</span>
      </div>
      <p class="footer-brand__tagline">{{ business.tagline }}</p>
      <p class="footer-brand__bio">{{ business.shortBio }}</p>

      <!-- Social Links -->
      <div class="footer-social" role="list" aria-label="Social media links">
        <a
          *ngFor="let link of business.social"
          [href]="link.url"
          target="_blank"
          rel="noopener noreferrer"
          class="footer-social__link"
          [attr.aria-label]="link.platform"
        >
          <i [class]="link.icon" aria-hidden="true"></i>
        </a>
      </div>
    </div>

    <!-- ── Quick Nav ── -->
    <nav class="footer-nav" aria-label="Footer navigation">
      <span class="footer-nav__heading section-label">Quick Links</span>
      <ul role="list">
        <li *ngFor="let item of business.nav">
          <a [routerLink]="item.route" class="footer-nav__link">
            {{ item.label }}
          </a>
        </li>
      </ul>
    </nav>

    <!-- ── Contact Column ── -->
    <div class="footer-contact">
      <span class="footer-contact__heading section-label">Get In Touch</span>

      <a [href]="'tel:' + business.phone" class="footer-contact__item">
        <i class="fa-solid fa-phone" aria-hidden="true"></i>
        {{ business.phone }}
      </a>

      <a [href]="'mailto:' + business.email" class="footer-contact__item">
        <i class="fa-solid fa-envelope" aria-hidden="true"></i>
        {{ business.email }}
      </a>

      <span class="footer-contact__item footer-contact__item--location">
        <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
        {{ business.location }}
      </span>

      <a [routerLink]="business.ctaRoute" class="btn-primary footer-contact__cta">
        <i class="fa-solid fa-calendar-check" aria-hidden="true"></i>
        Check Availability
      </a>
    </div>

  </div>

  <!-- ── Bottom Bar ── -->
  <div class="footer-bottom">
    <p class="footer-bottom__copy">
      &copy; {{ currentYear }} {{ business.name }}. All rights reserved.
    </p>
    <p class="footer-bottom__built">
      Crafted with <i class="fa-solid fa-heart" aria-hidden="true"></i> in Cape Town
    </p>
  </div>
</footer>
